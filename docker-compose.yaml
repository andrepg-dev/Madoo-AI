version: '3.8'

services:
  # 1. Contenedor de la Base de Datos
  madoo-db:
    image: postgres:15-alpine
    container_name: madoo-db
    restart: always
    environment:
      POSTGRES_USER: madoo
      POSTGRES_PASSWORD: madoo
      POSTGRES_DB: madoo
    ports:
      - "5432:5432"
    volumes:
      - madoo_pgdata:/var/lib/postgresql/data
    networks:
      - madoo-ai_default

  # 2. Contenedor de tu Backend
  madoo-backend:
    build:
      context: .
      dockerfile: apps/backend/Dockerfile
    container_name: madoo-backend
    restart: always
    ports:
      - "4000:4000"
    env_file:
      - .env
    depends_on:
      - madoo-db
    networks:
      - madoo-ai_default

# Persistencia de datos para que no se borren si apagas Docker
volumes:
  madoo_pgdata:

# Usamos la red que ya tenías configurada
networks:
  madoo-ai_default:
    driver: bridge