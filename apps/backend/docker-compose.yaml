services:
  madoo-db:
    image: postgres:16-alpine
    container_name: madoo-db
    restart: unless-stopped
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-madoo}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-madoo}
      POSTGRES_DB: ${POSTGRES_DB:-madoo}
    volumes:
      - madoo-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-madoo} -d ${POSTGRES_DB:-madoo}"]
      interval: 5s
      timeout: 5s
      retries: 10

  madoo-redis:
    image: redis:7-alpine
    container_name: madoo-redis
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - madoo-redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ../../
      dockerfile: apps/backend/Dockerfile
    container_name: madoo-backend
    restart: unless-stopped
    ports:
      - "${PORT:-4000}:4000"
    env_file:
      - .env
    environment:
      # Container runs built dist/; avoid dev-only pino-pretty transport from a host .env NODE_ENV=development.
      NODE_ENV: production
      # Hostnames match Docker Compose service names (not localhost from inside the backend container).
      DATABASE_URL: postgresql://${POSTGRES_USER:-madoo}:${POSTGRES_PASSWORD:-madoo}@madoo-db:5432/${POSTGRES_DB:-madoo}?schema=public
      REDIS_URL: redis://madoo-redis:6379
    depends_on:
      madoo-db:
        condition: service_healthy
      madoo-redis:
        condition: service_healthy

  mcp:
    build:
      context: ../../
      dockerfile: apps/mcp/Dockerfile
    container_name: madoo-mcp
    restart: unless-stopped
    ports:
      - "${MCP_PORT:-4100}:4100"
    env_file:
      - ../mcp/.env
    environment:
      # Reach the API over the compose network, not localhost.
      MADOO_API_URL: http://backend:4000/api/v1
    depends_on:
      - backend

volumes:
  madoo-postgres-data:
  madoo-redis-data:

