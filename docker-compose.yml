services:
  postgres:
    image: postgres:16-alpine
    container_name: madoo-postgres
    restart: unless-stopped
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-madoo}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-madoo}
      POSTGRES_DB: ${POSTGRES_DB:-madoo}
    volumes:
      - madoo-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-madoo} -d ${POSTGRES_DB:-madoo}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: madoo-redis
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - madoo-redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  madoo-postgres-data:
  madoo-redis-data:
